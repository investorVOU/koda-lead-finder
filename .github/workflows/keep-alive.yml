name: Keep Alive

on:
  schedule:
    # Every 5 minutes — keeps Render free tier from spinning down (15 min threshold)
    - cron: "*/5 * * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping KodaRai
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.RENDER_URL }}/api/ping")
          echo "Response: $STATUS — $(date -u)"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: got $STATUS instead of 200"
          fi
