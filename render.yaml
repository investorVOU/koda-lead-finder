services:
  - type: web
    name: kodarai
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22

      # ── Supabase ────────────────────────────────────────────────────
      - key: SUPABASE_URL
        value: https://hpfirxvqvyfnijocohga.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_9tJur7wChKpKQ8BcldPFtw_ccSktsOH
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # paste in Render dashboard → secret
      # Needed at Vite build time so client-side code gets the values
      - key: VITE_SUPABASE_URL
        value: https://hpfirxvqvyfnijocohga.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_9tJur7wChKpKQ8BcldPFtw_ccSktsOH

      # ── AI & Search ─────────────────────────────────────────────────
      - key: LOVABLE_API_KEY
        sync: false          # Lovable AI gateway key
      - key: GOOGLE_PLACES_API_KEY
        sync: false          # Google Cloud Console → Places API

      # ── Stripe ──────────────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false          # Stripe dashboard → Developers → API keys
      - key: STRIPE_WEBHOOK_SECRET
        sync: false          # Stripe dashboard → Webhooks → signing secret

      # ── Paystack ────────────────────────────────────────────────────
      - key: PAYSTACK_SECRET_KEY
        sync: false          # Paystack dashboard → Settings → API keys
