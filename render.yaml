services:
  - type: web
    name: kodarai
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22

      # ── Supabase ────────────────────────────────────────────────────
      - key: SUPABASE_URL
        value: https://hpfirxvqvyfnijocohga.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_9tJur7wChKpKQ8BcldPFtw_ccSktsOH
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # paste in Render dashboard → secret
      # Needed at Vite build time so client-side code gets the values
      - key: VITE_SUPABASE_URL
        value: https://hpfirxvqvyfnijocohga.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_9tJur7wChKpKQ8BcldPFtw_ccSktsOH

      # ── hCaptcha ────────────────────────────────────────────────────
      - key: VITE_HCAPTCHA_SITE_KEY
        sync: false          # hcaptcha.com → Sites → Site key (public)

      # ── AI providers ────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false          # aistudio.google.com → API keys
      - key: GROQ_API_KEY
        sync: false          # console.groq.com → API keys

      # ── Google Places ────────────────────────────────────────────────
      - key: GOOGLE_PLACES_API_KEY
        sync: false          # Google Cloud Console → Places API

      # ── Stripe ──────────────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false          # Stripe dashboard → Developers → API keys
      - key: STRIPE_WEBHOOK_SECRET
        sync: false          # Stripe dashboard → Webhooks → signing secret

      # ── Paystack ────────────────────────────────────────────────────
      - key: PAYSTACK_SECRET_KEY
        sync: false          # Paystack dashboard → Settings → API keys

      # ── Telnyx (persistent virtual numbers) ─────────────────────────
      - key: TELNYX_API_KEY
        sync: false          # telnyx.com → API Keys
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false          # telnyx.com → Messaging → Messaging Profiles
      - key: TELNYX_WEBHOOK_SECRET
        sync: false          # telnyx.com → API Keys → Ed25519 public key (base64)
      - key: TELNYX_WEBHOOK_BASE_URL
        value: https://kodarai.xyz

      # ── SMSPool (temp / one-time OTP numbers) ───────────────────────
      - key: SMSPOOL_API_KEY
        sync: false          # smspool.net → API

      - key: APP_URL
        value: https://kodarai.xyz
      - key: FOLLOW_UP_REMINDER_CRON_SECRET
        sync: false
